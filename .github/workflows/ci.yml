# Tinker CI — headless tests, determinism cross-check, UI smoke test, Android debug APK.
#
# Jobs:
#   test     : unit tests + 100-replay determinism harness; uploads the outcome hashes.
#   android  : builds web + APK; the web build must be audible (tools/web_audio_check.js)
#   smoke    : drives the real touch path under Xvfb (drag, snap, rotate, play, solve) with screenshots.
#   android  : exports a signed debug APK (artifact "tinker-debug-apk").
#   hashes   : fails if the determinism hash from `test` differs from the one recorded in
#              levels/hashes.txt (updated deliberately when physics or a level changes).
#
# Store signing secrets (release keystore etc.) are NOT needed here; they come in M7.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1-stable

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import project
        run: godot --headless --path game --import || true
      - name: Headless tests (100 replays)
        run: godot --headless --fixed-fps 60 --path game -s res://tests/run_tests.gd -- --replays=100
      - name: Determinism hash must match the recorded one
        run: |
          echo "recorded:"; cat levels/hashes.txt
          echo "this run:"; cat build/determinism-hashes.txt
          diff <(sort levels/hashes.txt) <(sort build/determinism-hashes.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/test-report.txt
            build/determinism-hashes.txt

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot + Xvfb + Mesa
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 libasound2t64 >/dev/null
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path game --import || true
      - name: UI smoke tests (synthetic touches, screenshots)
        run: |
          mkdir -p build/shots
          for L in res://levels/campaign/001.json res://levels/tests/t_ui_attach.json; do
            timeout 120 xvfb-run -a -s "-screen 0 1200x2100x24" godot --path game --rendering-driver opengl3 --resolution 540x960 --quit-after 1800 res://scenes/level.tscn -- --smoke --level=$L 2>&1 | tee -a build/smoke.log
          done
          [ "$(grep -c 'SMOKE PASS' build/smoke.log)" = "2" ]
      - name: Campaign flow test (world select -> level 1 -> Next -> back, save persisted)
        run: |
          timeout 180 xvfb-run -a -s "-screen 0 1200x2100x24" godot --path game --rendering-driver opengl3 --resolution 540x960 --quit-after 3000 -- --flow 2>&1 | tee build/flow.log
          grep -q "FLOW PASS" build/flow.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: |
            build/shots/*.png
            build/smoke.log
            build/flow.log

  daily:
    # Server API tests on the Firestore emulator + the full Daily cycle (real generator, real
    # server-side replay, game client playing through the touch path) on a throwaway backend.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Godot + Xvfb + emulator
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 libasound2t64 >/dev/null
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          npm i -g firebase-tools@15.34.2 >/dev/null && firebase setup:emulators:firestore >/dev/null
          cd server && npm ci
      - name: Import project
        run: godot --headless --path game --import || true
      - name: Server tests + full day cycle
        run: bash tools/ci_daily.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-logs
          path: /tmp/*.log

  android:
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Install Godot + export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o tpz.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q tpz.zip -d tpz && mv tpz/templates ~/.local/share/godot/export_templates/${GODOT_VERSION/-stable/.stable}
      - name: Point Godot at the SDK and JDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
      - name: Build web + Android (TinkerPush plugin, Gradle) with placeholder Firebase values
        run: FIREBASE_DUMMY=1 GRADLE=gradle bash tools/build_clients.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web build must be audible (music reaches the speakers in headless Chromium)
        run: |
          npm install --no-save --prefix /tmp/pw playwright@1.63.0
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          (cd build/web && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 1
          NODE_PATH=/tmp/pw/node_modules node tools/web_audio_check.js http://127.0.0.1:8080/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: tinker-debug-apk
          path: build/download/tinker.apk
